# 静态分析配置。
#
# 与 app 端保持同一套规则，避免两端因为 lint 门槛不同再次出现"只改了一边"。
# 基线 flutter_lints 已包含 avoid_print 等基础规则。
#
# 注意：首次开启会暴露一批存量告警，主要来自 SmartDialog.showToast
# （返回 Future<void>，全仓约 43 处）。这类"发完就不管"的调用按规则
# 应显式写成 unawaited(...)；新代码请直接遵守。
include: package:flutter_lints/flutter.yaml

linter:
  rules:
    # async 函数里漏 await：Future 被创建后直接丢弃
    - unawaited_futures
    # 非 async 上下文里丢弃 Future：覆盖回调、构造函数、初始化里的漏 await。
    # 确属"发射后不管"的调用请显式写 unawaited(...)，让意图可见。
    - discarded_futures
