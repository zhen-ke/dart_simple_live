name: simple_live_shared
version: 1.0.0
description: "simple_live_app 与 simple_live_tv_app 共享的模型与基础层"
repository: https://github.com/xiaoyaocz/dart_simple_live
publish_to: "none"
environment:
  sdk: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter
  simple_live_core:
    path: ../simple_live_core
  flutter_smart_dialog: ^4.9.8+9
  # 与两端保持同一精确版本：Hive TypeAdapter 的二进制格式由它决定
  hive: 2.2.3
  dio: ^5.9.0
  uuid: ^4.5.1
  collection: ^1.19.0
  remixicon: ^1.4.1
  get: ^4.7.2
  logger: ^2.6.1
  intl: ^0.20.2
  device_info_plus: ^12.1.0
  package_info_plus: ^9.0.0
  path_provider: ^2.1.5
  network_info_plus: ^7.0.0
  shelf: ^1.4.2
  shelf_router: ^1.1.4
  udp: ^5.0.3

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
