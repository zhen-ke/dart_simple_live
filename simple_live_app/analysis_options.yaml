# 静态分析配置。
#
# 基线用 flutter_lints 官方推荐集（其中已包含 avoid_print 等基础规则），
# 这里只补本项目真实踩过的两类异步问题——它们造成的都是"静默失败"：
# 请求发出去了、结果没人接，出错也不冒泡。
#
# 注意：首次开启会暴露一批存量告警，主要来自 SmartDialog.showToast
# （返回 Future<void>，全仓约 135 处）。这类"发完就不管"的调用按规则
# 应显式写成 unawaited(...)，让意图可见；新代码请直接遵守。
include: package:flutter_lints/flutter.yaml

linter:
  rules:
    # async 函数里漏 await：Future 被创建后直接丢弃
    - unawaited_futures
    # 非 async 上下文里丢弃 Future：覆盖回调、构造函数、初始化里的漏 await。
    # 确属"发射后不管"的调用请显式写 unawaited(...)，让意图可见。
    - discarded_futures
